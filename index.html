function parseYMD(x){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(x||""));return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null}
function addDays(s,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return s;return ymd(new Date(+m[1],+m[2]-1,+m[3]+n))}
function daysBetween(a,b){const x=parseYMD(a),y=parseYMD(b||a);if(x===null||y===null||y<x)return 0;return Math.round((y-x)/86400000)+1}
function fmtDate(x){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||""));return m?m[3]+"-"+m[2]+"-"+m[1]:(x||"-")}

function perRange(per,from,to){
 const t=todayStr();
 switch(per){
  case"today":return[t,t];
  case"yesterday":{const y=addDays(t,-1);return[y,y]}
  case"tomorrow":{const y=addDays(t,1);return[y,y]}
  case"week":{const dow=(new Date().getDay()+6)%7,s=addDays(t,-dow);return[s,addDays(s,6)]}
  case"month":return[t.slice(0,8)+"01",monthEnd(t)];
  case"year":return[t.slice(0,4)+"-01-01",t.slice(0,4)+"-12-31"];
  case"custom":return[from||"",to||""];
  default:return["",""];
 }
}

 const its=(Array.isArray(itemsRaw)?itemsRaw:[]).filter(i=>i&&typeof i==="object");
 const sorted=bks.map(b=>Object.assign({},b,{id:String(b.id||uid())})).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||a.id.localeCompare(b.id));
 const custs={};
 sorted.forEach((b,i)=>{
  const name=String(b.name||"").trim(),phone=String(b.phone||"").trim();
  let cid="";
  if(name||digits(phone)){
   cid=custId(bid,name,phone);
   if(!custs[cid])custs[cid]={id:cid,bid,name,phone,address:b.address||"",notes:"",createdAt:now,updatedAt:now};
  }
  const adv=num(b.advance);
  out.bookings.push({id:b.id,bid,no:"B-"+pad4(i+1),customerId:cid,name,phone,category:b.category||"अन्य",date:b.date||"",endDate:b.endDate||b.date||"",time:b.time||"",address:b.address||"",amount:num(b.amount),advance:adv,status:validStatus(b.status),notes:b.notes||"",payDue:b.payDue||"",workers:(b.workers||[]).map(normW).map(w=>({cat:w.cat,name:w.name,rate:w.rate,days:w.days,amount:wTotal(w)})),createdAt:b.updatedAt||now,updatedAt:now});
  if(adv>0)out.payments.push({id:"adv_"+b.id,bid,bookingId:b.id,customerId:cid,amount:adv,date:String(b.updatedAt||"").slice(0,10)||todayStr(),method:"कैश",type:"advance",note:"",updatedAt:now});
 });

 return out;

function payIdx(){return memo("payIdx",()=>{
 const bk=new Set(rows("bookings").map(b=>b.id)),iv=new Set(rows("invoices").map(i=>i.id)),m=new Map(),im=new Map(),ok=[];
 rows("payments").forEach(p=>{

  else if(p.invoiceId){if(!iv.has(p.invoiceId))return;im.set(p.invoiceId,(im.get(p.invoiceId)||0)+num(p.amount))}
  ok.push(p);
 });
 return {m,im,ok};
})}

function invCalc(i){
 const sub=(i.lines||[]).reduce((s,l)=>s+num(l.q)*num(l.r),0);
 const disc=i.discType==="%"?sub*num(i.discVal)/100:num(i.discVal);
 const taxable=Math.max(0,sub-disc),gst=taxable*num(i.gstPct)/100,total=taxable+gst;
 return {sub:r2(sub),disc:r2(disc),taxable:r2(taxable),gst:r2(gst),total:r2(total)};
}

function ledgerRows(){return memo("lrows",()=>{
 const out=[],bm=new Map(rows("bookings").map(b=>[b.id,b])),im=new Map(rows("invoices").map(i=>[i.id,i]));
 rows("ledger").forEach(l=>out.push({src:"ledger",id:l.id,date:l.date,type:l.type,cat:l.cat,amount:num(l.amount),method:l.method||"",note:l.note||"",rec:l}));
 payIdx().ok.forEach(p=>{
  const b=p.bookingId?bm.get(p.bookingId):null,iv=p.invoiceId?im.get(p.invoiceId):null;
  out.push({src:"payment",id:p.id,date:p.date,type:"income",cat:AUTO_INC,amount:num(p.amount),method:p.method||"",note:(b?b.name:(iv?iv.name:""))+(p.note?" • "+p.note:""),rec:p});
 });
 const em=new Map(rows("employees").map(e=>[e.id,e]));
 rows("empPayments").forEach(p=>{const e=em.get(p.empId);out.push({src:"emp",id:p.id,date:p.date,type:"expense",cat:"मजदूरी",amount:num(p.amount),method:p.method||"",note:(e?e.name:"")+(p.note?" • "+p.note:""),rec:p})});
 if(PREF.countWorkers!==false)rows("bookings").forEach(b=>{if(b.status==="रद्द")return;const w=workersSum(b.workers);if(w>0)out.push({src:"bworker",id:b.id,date:b.date,type:"expense",cat:"मजदूरी",amount:w,method:"",note:b.name+" ("+L("बुकिंग के कारीगर","booking workers")+")",rec:b})});
 return out;
})}
// किसी अवधि का पूरा सार (नकद आधार पर लाभ = प्राप्त आय − खर्च)
function calc(a,b){
 const lr=ledgerRows().filter(r=>inR(r.date,a,b));
 const income=lr.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
 const expense=lr.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
 const bks=rows("bookings").filter(x=>x.status!=="रद्द"&&inR(x.date,a,b));
 const ivs=rows("invoices").filter(i=>i.type==="invoice"&&!i.bookingId&&inR(i.date,a,b));
 const salesItems=lr.filter(r=>r.src==="ledger"&&r.type==="income"&&r.cat==="सामान की बिक्री").reduce((s,r)=>s+r.amount,0);
 const sales=bks.reduce((s,x)=>s+num(x.amount),0)+ivs.reduce((s,i)=>s+invCalc(i).total,0)+salesItems;
 const pending=bks.reduce((s,x)=>s+balance(x),0)+ivs.reduce((s,i)=>s+Math.max(0,invCalc(i).total-invPaid(i)),0);
 return {income,expense,profit:income-expense,sales,pending,bookings:bks.length,lr};
}
function custStats(c){
 const bks=rows("bookings").filter(b=>b.customerId===c.id);
 const act=bks.filter(b=>b.status!=="रद्द");
 const total=act.reduce((s,b)=>s+num(b.amount),0),pd=act.reduce((s,b)=>s+paid(b),0);
 const last=bks.map(b=>b.date).filter(Boolean).sort().pop()||"";
 return {count:bks.length,total,paid:pd,due:Math.max(0,total-pd),last,bks};
}

/* ---------- Cloud Sync (Firebase) ---------- */
let auth=null,fdb=null,CU=null,cloudOn=false,flushing=false,retryN=0,flushT=null,unsubs=[];
const SYNC={state:"off",last:"",err:""};
function setSync(state,err){SYNC.state=state;if(err!==undefined)SYNC.err=err;if(state==="ok")SYNC.last=nowISO();if(typeof paintSync==="function")paintSync()}
const userBase=()=>fdb.collection("users").doc(CU.uid);
const cleanRec=r=>JSON.parse(JSON.stringify(r));
function normRec(c,r){
 r.id=String(r.id);
 if(c!=="businesses"&&!r.bid)r.bid=MAIN;
 if(c==="bookings"){r.workers=Array.isArray(r.workers)?r.workers:[];r.status=validStatus(r.status);if(!r.endDate)r.endDate=r.date||""}
 return r;
}
function schedFlush(ms){clearTimeout(flushT);flushT=setTimeout(flushQueue,ms==null?800:ms)}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
async function flushQueue(){
 if(flushing||!CU||!fdb||!cloudOn)return;
 const keys=Object.keys(Q);
 if(!keys.length){setSync("ok","");return}
 if(navigator.onLine===false){setSync("offline");return}
 flushing=true;setSync("busy");
 try{
  const base=userBase();
  for(let i=0;i<keys.length;i+=300){
   const part=keys.slice(i,i+300).filter(k=>Q[k]),vers=part.map(k=>Q[k].n),b=fdb.batch();
   part.forEach(k=>{
    const q=Q[k],ref=base.collection(q.c).doc(q.id);
    if(q.op==="del")b.delete(ref);
    else{const r=getR(q.c,q.id);if(r&&!r.auto)b.set(ref,cleanRec(r))}
   });
   await withTimeout(b.commit(),25000);
   part.forEach((k,ix)=>{if(Q[k]&&Q[k].n===vers[ix])delete Q[k]});
   persist();
  }
  retryN=0;setSync(Object.keys(Q).length?"busy":"ok","");
  if(Object.keys(Q).length)schedFlush(500);
 }catch(e){
  console.error(e);retryN++;setSync("err",(e&&e.message)||"error");
  schedFlush(Math.min(120000,3000*Math.pow(2,Math.min(retryN,6)))); // सिंक फेल होने पर अपने-आप दोबारा प्रयास
 }finally{flushing=false}
}
function applyRemote(c,r){
 normRec(c,r);
 if(Q[c+"/"+r.id])return false;       // लोकल बदलाव अभी भेजा जाना बाकी है — उसे न बदलें
 const a=DB[c],i=a.findIndex(x=>x.id===r.id);
 if(i<0){a.push(r);return true}
 if(recTs(r)>recTs(a[i])){a[i]=r;return true}
 return false;
}
function stopListeners(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[]}
function attachListeners(){
 stopListeners();const base=userBase();
 COLS.forEach(c=>{
  unsubs.push(base.collection(c).onSnapshot(s=>{
   if(!cloudOn)return;
   let ch=false;
   s.docChanges().forEach(d=>{
    if(d.doc.metadata.hasPendingWrites)return;
    if(d.type==="removed"){
     if(s.metadata.fromCache||Q[c+"/"+d.doc.id])return;
     const n=DB[c].length;DB[c]=DB[c].filter(x=>x.id!==d.doc.id);if(DB[c].length!==n)ch=true;return;
    }
    if(applyRemote(c,Object.assign({},d.doc.data(),{id:d.doc.id})))ch=true;
   });
   if(ch){ensureBusiness();persist();if(typeof refresh==="function")refresh(true)}
  },e=>setSync("err",e.message)));
 });
}
function legacyBizDoc(p){const b=legacyBizFrom(p,"");b.updatedAt="1";return b}
async function initialSync(){
 const base=userBase();setSync("busy");
 const snaps=await Promise.all(COLS.map(c=>base.collection(c).get()));
 let legacy=null;try{const ps=await base.collection("profile").doc("main").get();if(ps.exists)legacy=ps.data()}catch(e){}
 const remote={};COLS.forEach((c,i)=>{remote[c]=snaps[i].docs.map(d=>Object.assign({},d.data(),{id:d.id}))});
 if(legacy&&!remote.businesses.some(b=>b.id===MAIN))remote.businesses.push(legacyBizDoc(legacy));
 COLS.forEach(c=>{
  const rm=new Map(remote[c].map(r=>[r.id,normRec(c,r)])),lm=new Map(DB[c].map(r=>[r.id,r]));
  rm.forEach((r,id)=>{
   if(Q[c+"/"+id]&&Q[c+"/"+id].op==="del")return;   // यूज़र ने बिन से पक्का डिलीट किया था — वापस न लाएँ
   const l=lm.get(id);
   if(!l)DB[c].push(r);
   else if(recTs(r)>recTs(l))DB[c][DB[c].indexOf(l)]=r;
   else if(recTs(l)>recTs(r)&&!l.auto)enq(c,id,"set");
  });
  lm.forEach((l,id)=>{if(!rm.has(id)&&!l.auto)enq(c,id,"set")});
 });
 ensureAdvPayments();ensureBusiness();persist(true);
 cloudOn=true;attachListeners();await flushQueue();
 setSync(Object.keys(Q).length?"busy":"ok","");
}
// एक ही मोबाइल पर दूसरे Google खाते का डेटा न मिले
async function guardOwner(user){
 const own=localStorage.getItem(OWN_KEY);
 if(!own||own===user.uid){localStorage.setItem(OWN_KEY,user.uid);return true}
 const hasLocal=COLS.some(c=>c!=="businesses"&&DB[c].length);
 if(!hasLocal){localStorage.setItem(OWN_KEY,user.uid);return true}
 const yes=confirm(L("इस मोबाइल में किसी दूसरे Google खाते का डेटा रखा है।\n\nOK दबाने पर: उस डेटा की बैकअप फाइल डाउनलोड होगी, फिर इस खाते का Cloud डेटा लोड होगा।\nCancel दबाने पर: Login रद्द होगा (डेटा आपस में नहीं मिलेगा)।","This phone holds data of a different Google account.\n\nOK: a backup file of that data is downloaded, then this account's Cloud data loads.\nCancel: login is cancelled (data will not mix)."));
 if(!yes)return false;
 try{backupDownload("WORK-Manager-Before-Switch-")}catch(e){}
 DB=emptyDB();Q={};localStorage.setItem(OWN_KEY,user.uid);ensureBusiness();persist(true);return true;
}
function initFirebase(){
 try{
  if(!window.firebase){setSync("off","Firebase लोड नहीं हुआ");return}
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();fdb=firebase.firestore();
  try{fdb.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(x){}
  auth.onAuthStateChanged(async user=>{
   CU=user;cloudOn=false;stopListeners();
   if(user){
    const ok=await guardOwner(user);
    if(!ok){await auth.signOut();return}
    try{await initialSync()}catch(e){console.error(e);cloudOn=!!(e&&e.code!=="permission-denied");setSync("err",(e&&e.message)||"error")}
   }else setSync("off","");
   if(typeof refresh==="function")refresh();
  });
 }catch(e){console.error(e);setSync("err",e.message)}
}
async function googleLogin(){
 if(!auth){toast(L("Firebase लोड नहीं हुआ। इंटरनेट जांचें।","Firebase did not load. Check internet."),"err");return}
 try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
 catch(e){
  if(["auth/popup-blocked","auth/popup-closed-by-user","auth/operation-not-supported-in-this-environment"].includes(e.code)){
   try{await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())}catch(x){toast(L("Login समस्या: ","Login problem: ")+x.message,"err")}
  }else if(e.code!=="auth/cancelled-popup-request")toast(L("Google Login समस्या: ","Google Login problem: ")+e.message,"err");
 }
}
function googleLogout(){if(confirm(L("क्या Logout करना चाहते हैं? (डेटा इस मोबाइल में सुरक्षित रहेगा)","Logout? (data stays safe on this phone)")))auth.signOut()}

function monthSeries(n){
 const out=[],d=new Date();d.setDate(1);
 for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1),s=ymd(x),e=monthEnd(s),c=calc(s,e);out.push({label:(LANG==="en"?x.toLocaleString("en",{month:"short"}):["जन","फर","मार्च","अप्रै","मई","जून","जुला","अग","सित","अक्टू","नव","दिस"][x.getMonth()]),sales:c.sales,exp:c.expense,inc:c.income})}
 return out;
}
function barChart(data,keys,colors){
 const W=340,H=170,pl=38,pb=24,pt=10,n=data.length,max=Math.max(1,...data.flatMap(d=>keys.map(k=>d[k]))),bw=(W-pl)/n,gw=Math.min(14,(bw-8)/keys.length);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let i=0;i<=3;i++){const y=pt+(H-pt-pb)*(1-i/3);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".12"/><text x="${pl-4}" y="${y+4}" font-size="10" text-anchor="end">${short(max*i/3)}</text>`}
 data.forEach((d,i)=>{
  const cx=pl+bw*i+bw/2;
  keys.forEach((k,j)=>{const h=(H-pt-pb)*d[k]/max,x=cx-gw*keys.length/2+gw*j;s+=`<rect x="${x}" y="${H-pb-h}" width="${gw-1}" height="${Math.max(h,0)}" rx="3" fill="${colors[j]}"/>`});
  s+=`<text x="${cx}" y="${H-7}" font-size="11" text-anchor="middle">${esc(d.label)}</text>`;
 });
 return s+"</svg>";
}
function donut(a,b,ca,cb){
 const tot=a+b,pa=tot>0?a/tot:0,R=42,C=2*Math.PI*R;
 return `<svg viewBox="0 0 120 120" width="130" height="130"><circle cx="60" cy="60" r="${R}" fill="none" stroke="${cb}" stroke-width="16"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${ca}" stroke-width="16" stroke-dasharray="${C*pa} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="58" font-size="15" font-weight="800" text-anchor="middle" style="fill:var(--text)">${Math.round(pa*100)}%</text><text x="60" y="74" font-size="10" text-anchor="middle">${L("प्राप्त","received")}</text></svg>`;
}

const dateRangeText=b=>(b.endDate&&b.endDate!==b.date)?fmtDate(b.date)+" → "+fmtDate(b.endDate)+" ("+daysBetween(b.date,b.endDate)+" "+L("दिन","days")+")":fmtDate(b.date)+(b.time?" • "+fmtTime(b.time):"");
function filterBookings(){
 const f=S.bf,[a,z]=perRange(f.per,f.from,f.to),q=f.q.trim().toLowerCase();
 return rows("bookings").filter(bk=>{
  if(a||z){const s=bk.date||"",e=bk.endDate||bk.date||"";if(z&&s>z)return false;if(a&&e<a)return false}
  if(f.st==="pending"&&(bk.status==="काम पूरा"||bk.status==="रद्द"))return false;
  if(f.st==="done"&&bk.status!=="काम पूरा")return false;
  if(f.st==="cancel"&&bk.status!=="रद्द")return false;
  if(f.st==="due"&&!(bk.status!=="रद्द"&&balance(bk)>0))return false;
  if(q){const hay=[bk.name,bk.phone,bno(bk),bk.category,catL(bk.category),bk.address,bk.date,fmtDate(bk.date),bk.endDate,fmtDate(bk.endDate),bk.notes,stLabel(bk.status)].join(" ").toLowerCase();if(!hay.includes(q))return false}
  return true;
 });
}

function bookingListHtml(){
 const t=new Date();t.setHours(0,0,0,0);const tk=todayStr(),list=filterBookings();
 const open=list.filter(b=>b.status!=="काम पूरा"),done=list.filter(b=>b.status==="काम पूरा");
 open.sort((a,b)=>{const fa=(a.date||"")>=tk,fb=(b.date||"")>=tk;if(fa!==fb)return fa?-1:1;return fa?String(a.date).localeCompare(b.date):String(b.date).localeCompare(a.date)});

/* ---------- कारीगर / आदमियों का भुगतान (पुराना फीचर, दिन और हाजिरी के साथ) ---------- */
let workersDraft=[];
const WCAT_KEY=OLD.wcat,WRATE_KEY=OLD.wrate,DEFAULT_CATS=["बर्तन वाला","रसोईया","सफाई वाला","हलवाई","वेटर","सहायक"];
let workerCats=sp(localStorage.getItem(WCAT_KEY),null);if(!Array.isArray(workerCats)||!workerCats.length)workerCats=DEFAULT_CATS.slice();
let workerRates=sp(localStorage.getItem(WRATE_KEY),{});if(!workerRates||typeof workerRates!=="object"||Array.isArray(workerRates))workerRates={};
const saveWorkerPrefs=()=>{try{localStorage.setItem(WCAT_KEY,JSON.stringify(workerCats));localStorage.setItem(WRATE_KEY,JSON.stringify(workerRates))}catch(e){}};
const wLabel=w=>{const c=String(w.cat||"").trim(),n=String(w.name||"").trim();return c&&n?c+" – "+n:(c||n||L("कारीगर","Worker"))};
const NUM_WORDS={"डेढ़":1.5,"डेढ":1.5,"ढाई":2.5,"एक":1,"दो":2,"तीन":3,"चार":4,"पांच":5,"पाँच":5,"छह":6,"छः":6,"सात":7,"आठ":8,"नौ":9,"दस":10},UNIT_WORDS={"हजार":1000,"हज़ार":1000,"सौ":100},RUPEE_WORDS=["रुपए","रुपये","रुपया","रु","रु.","rs","rs.","/-"];
function parseWorkers(text){
 let s=String(text||"").replace(/[०-९]/g,d=>"०१२३४५६७८९".indexOf(d));
 s=s.replace(/(\d),(?=\d{3})/g,"$1").replace(/₹/g," ").replace(/\/-/g," ").replace(/[:=]/g," ").replace(/([ऀ-ॿ])(\d)/g,"$1 $2").replace(/[,\n;]+/g," , ");
 const tk=s.split(/\s+/).filter(x=>x&&x!=="-"),out=[];let name=[];
 const emit=amt=>{out.push({name:name.join(" ").trim(),amount:Math.round(amt)});name=[]};
 const skipR=i=>(i+1<tk.length&&RUPEE_WORDS.includes(tk[i+1].toLowerCase()))?i+1:i;
 for(let i=0;i<tk.length;i++){
  const w=tk[i];
  if(w===","){if(name.length)emit(0);continue}
  if(/^\d+(\.\d+)?$/.test(w)){let amt=parseFloat(w);if(i+1<tk.length&&UNIT_WORDS[tk[i+1]]){amt*=UNIT_WORDS[tk[i+1]];i++}i=skipR(i);emit(amt);continue}
  if(NUM_WORDS[w]!==undefined&&i+1<tk.length&&UNIT_WORDS[tk[i+1]]){const amt=NUM_WORDS[w]*UNIT_WORDS[tk[i+1]];i++;i=skipR(i);emit(amt);continue}
  if(UNIT_WORDS[w]){i=skipR(i);emit(UNIT_WORDS[w]);continue}
  name.push(w);
 }
 if(name.length)emit(0);
 return out;
}
function defaultDays(){const a=bkf("date"),b=bkf("endDate");return a?(daysBetween(a.value,b.value||a.value)||1):1}

function renderWorkers(){
 const dd=defaultDays();el("wDays").textContent="📆 "+L("काम के दिन:","Work days:")+" "+(dd||"-");
 el("wList").innerHTML=workersDraft.length?workersDraft.map((w,i)=>`<div class="wcard"><div class="wr1"><input data-in="wf" data-k="cat" data-i="${i}" value="${esc(w.cat)}" placeholder="${esc(L("कैटेगरी (जैसे रसोईया)","Category (e.g. Cook)"))}"><input data-in="wf" data-k="name" data-i="${i}" value="${esc(w.name)}" placeholder="${esc(L("नाम (वैकल्पिक)","Name (optional)"))}"><button type="button" class="btn danger" style="margin:0" data-act="wdel" data-id="${i}">🗑️</button></div>
 <div class="wr2"><div><small>${L("₹ प्रतिदिन","₹ per day")}</small><input data-in="wf" data-k="rate" data-i="${i}" type="number" inputmode="decimal" min="0" value="${w.rate||""}" placeholder="₹"></div><div><small>${L("दिन (हाजिरी)","Days (attendance)")}</small><input data-in="wf" data-k="days" data-i="${i}" type="number" inputmode="decimal" min="0" step="0.5" value="${w.days||""}" placeholder="0"></div><div class="wtot"><small>${L("कुल","Total")}</small><b data-wt="${i}">${money(wTotal(w))}</b></div></div></div>`).join(""):`<p class="small muted">${L("अभी कोई कारीगर नहीं जुड़ा।","No workers added yet.")}</p>`;
 el("wChips").innerHTML=workerCats.map((c,i)=>`<span style="display:inline-flex;align-items:center"><button type="button" class="chip" style="margin:3px 3px 0 0" data-act="wchip" data-id="${i}">+ ${esc(DEFAULT_CATS.includes(c)?L(c,{"बर्तन वाला":"Dishwasher","रसोईया":"Cook","सफाई वाला":"Cleaner","हलवाई":"Halwai","वेटर":"Waiter","सहायक":"Helper"}[c]):c)}</button>${DEFAULT_CATS.includes(c)?"":`<button type="button" class="chip" style="background:#7f1010;color:#fff" data-act="wcatdel" data-id="${i}">×</button>`}</span>`).join("");
 el("wTotal").textContent=money(workersSum(workersDraft));
}

ACT.wchip=t=>{const c=workerCats[+t.dataset.id];workersDraft.push({cat:c,name:"",rate:workerRates[c]||0,days:defaultDays()});renderWorkers()};

 const body=`<div class="h3" style="font-size:21px">${esc(c.name)}</div>

 <div class="kv"><span>${L("कुल बुकिंग","Total bookings")}</span><b>${s.count}</b></div><div class="kv"><span>${L("कुल खरीदारी","Total purchase")}</span><b>${money(s.total)}</b></div><div class="kv"><span>${L("कुल भुगतान","Total paid")}</span><b>${money(s.paid)}</b></div><div class="kv"><span>${L("बाकी राशि","Balance due")}</span><b style="color:var(--bad)">${money(s.due)}</b></div><div class="kv"><span>${L("पिछली बुकिंग","Last booking")}</span><b>${s.last?esc(fmtDate(s.last)):"-"}</b></div></div>

 <h3 class="h3" style="margin-top:14px">${L("बुकिंग इतिहास","Booking history")}</h3>${s.bks.length?s.bks.sort((a,b)=>String(b.date).localeCompare(a.date)).map(bookingCard).join(""):`<div class="small muted">${L("कोई बुकिंग नहीं।","No bookings.")}</div>`}`;

};
ACT.waCust=t=>{

 window.open("https://wa.me/"+waPhone(c.phone)+"?text="+encodeURIComponent(txt),"_blank");
};
ACT.delcust=t=>{
 const c=getR("customers",t.dataset.id);if(!c)return;
 if(!confirm(L("इस ग्राहक को रीसायकल बिन में भेजें? (बुकिंग रहेंगी)","Move this customer to Recycle bin? (bookings stay)")))return;
 softDel("customers",c.id);closeAllModals();refresh();toast(L("ग्राहक बिन में भेजा गया।","Customer moved to bin."),"ok",{label:L("वापस लाएँ","Undo"),fn:()=>{restoreR("customers",c.id);refresh()}});
};

/* ---------- भुगतान ---------- */
function payRows(){
 const f=S.pf,[a,z]=perRange(f.per,f.from,f.to),q=f.q.trim().toLowerCase(),bm=new Map(rows("bookings").map(b=>[b.id,b])),im=new Map(rows("invoices").map(i=>[i.id,i]));
 return payIdx().ok.filter(p=>inR(p.date,a,z)&&(f.m==="all"||p.method===f.m)).map(p=>({p,b:p.bookingId?bm.get(p.bookingId):null,i:p.invoiceId?im.get(p.invoiceId):null})).filter(x=>!q||((x.b?x.b.name+" "+bno(x.b):"")+(x.i?x.i.name+" "+x.i.no:"")+x.p.note+x.p.date).toLowerCase().includes(q)).sort((x,y)=>String(y.p.date).localeCompare(x.p.date));
}
function payListHtml(){
 const l=payRows();if(!l.length)return empty("💳",L("कोई भुगतान नहीं मिला।","No payments found."));
 return l.map(({p,b,i})=>`<div class="li" data-act="editpay" data-id="${esc(p.id)}"><div class="top"><strong>${money(p.amount)}</strong><span class="small muted">${esc(fmtDate(p.date))}</span></div>
 <div class="small">${b?"📋 "+esc(b.name)+" (#"+esc(bno(b))+")":i?"🧾 "+esc(i.name)+" ("+esc(i.no)+")":"-"}</div><div class="meta"><span class="pill info">${esc(ptL(p.type))}</span><span class="pill gray">${esc(pmL(p.method))}</span>${p.note?`<span class="small muted">${esc(p.note)}</span>`:""}</div></div>`).join("");
}
VIEWS.payments=()=>{
 const l=payRows(),tot=l.reduce((s,x)=>s+num(x.p.amount),0),by={};l.forEach(x=>{by[x.p.method]=(by[x.p.method]||0)+num(x.p.amount)});
 const pend=rows("bookings").filter(b=>b.status!=="रद्द"&&balance(b)>0).sort((a,b)=>balance(b)-balance(a));
 return pageHead("💳 "+L("भुगतान","Payments"),`<button class="btn" data-act="addpay">➕ ${L("भुगतान जोड़ें","Add payment")}</button>`)+
 `<div class="grid g3"><div class="kpi ok"><div class="l">${L("प्राप्त (चुनी अवधि)","Received (period)")}</div><div class="v">${money(tot)}</div></div>${PM.map(m=>`<div class="kpi"><div class="l">${pmL(m[0])}</div><div class="v">${money(by[m[0]]||0)}</div></div>`).join("")}</div>
 <div class="card" style="margin-top:12px"><div class="search"><input value="${esc(S.pf.q)}" data-in="pq" placeholder="${L("ग्राहक, बुकिंग नंबर, नोट खोजें...","Search customer, booking no, note...")}"></div>${perChips(S.pf.per,"pper",true)}${dateRangeInputs(S.pf,"pdate")}
 ${chipsHtml([["all",L("सभी माध्यम","All methods")]].concat(PM.map(m=>[m[0],pmL(m[0])])),S.pf.m,"pmeth")}</div>
 ${pend.length?`<div class="card"><h3>⏳ ${L("बाकी भुगतान वाली बुकिंग","Bookings with balance due")} (${pend.length})</h3>${pend.slice(0,8).map(b=>`<div class="kv" data-act="addpay" data-id="${esc(b.id)}" style="cursor:pointer"><span><b>${esc(b.name)}</b><br><small>${esc(dateRangeText(b))}</small></span><span><b style="color:var(--bad)">${money(balance(b))}</b> ➕</span></div>`).join("")}</div>`:""}
 <h3 class="h3">${L("भुगतान की हिस्ट्री","Payment history")}</h3><div id="plist">${payListHtml()}</div>`;
};
INP.pq=t=>{S.pf.q=t.value;el("plist").innerHTML=payListHtml()};
INP.pdate=t=>{S.pf[t.dataset.k]=t.value;el("plist").innerHTML=payListHtml()};
ACT.pper=t=>{S.pf.per=t.dataset.id;refresh()};ACT.pmeth=t=>{S.pf.m=t.dataset.id;refresh()};
// भुगतान जोड़ना / एडिट: (data-id = बुकिंग की आईडी, या एडिट में भुगतान की आईडी)
ACT.addpay=t=>{const id=t&&t.dataset?t.dataset.id:"";closeAllModals();openPayForm("",id||"",t&&t.dataset?t.dataset.inv:"")};
ACT.editpay=t=>{closeAllModals();openPayForm(t.dataset.id)};
function openPayForm(pid,bookingId,invoiceId){
 const p=pid?getR("payments",pid):null;
 const bk=rows("bookings").filter(b=>b.status!=="रद्द"&&(balance(b)>0||(p&&p.bookingId===b.id)||b.id===bookingId));
 const iv=rows("invoices").filter(i=>i.type==="invoice"&&!i.bookingId&&(Math.max(0,invCalc(i).total-invPaid(i))>0||(p&&p.invoiceId===i.id)||i.id===invoiceId));
 const cur=p?(p.bookingId?"b:"+p.bookingId:"i:"+p.invoiceId):(bookingId?"b:"+bookingId:invoiceId?"i:"+invoiceId:"");
 const opts=[["",L("— चुनें —","— choose —")]].concat(bk.map(b=>["b:"+b.id,"📋 "+b.name+" (#"+bno(b)+") — "+L("बाकी","due")+" "+money(balance(b))]),iv.map(i=>["i:"+i.id,"🧾 "+i.name+" ("+i.no+") — "+L("बाकी","due")+" "+money(Math.max(0,invCalc(i).total-invPaid(i)))]));
 const b0=cur.startsWith("b:")?getR("bookings",cur.slice(2)):null;
 openModal(p?L("✏️ भुगतान एडिट","✏️ Edit payment"):L("💳 भुगतान जोड़ें","💳 Add payment"),`<form data-form="pay"><input type="hidden" name="id" value="${esc(pid||"")}">
 ${fld(L("किसके लिए *","For *"),sel("target",opts,cur,"required"))}
 <div class="r2">${fld(L("राशि ₹ *","Amount ₹ *"),inp("amount",p?p.amount:(b0?balance(b0)||"":""),'type="number" inputmode="decimal" min="0" step="any" required'))}${fld(L("तारीख *","Date *"),inp("date",p?p.date:todayStr(),'type="date" required'))}</div>
 <div class="r2">${fld(L("भुगतान का माध्यम","Method"),sel("method",PM.map(m=>[m[0],pmL(m[0])]),p?p.method:"कैश"))}${fld(L("भुगतान का प्रकार","Type"),sel("ptype",PT.map(x=>[x[0],L(x[1],x[2])]),p?p.type:(b0&&paid(b0)===0?"advance":"partial")))}</div>
 ${fld(L("नोट","Note"),inp("note",p?p.note:""))}
 <button class="btn" type="submit">${L("सेव करें","Save")}</button>${p?`<button type="button" class="btn danger" data-act="delpay" data-id="${esc(pid)}">🗑️ ${L("डिलीट","Delete")}</button>`:""}<button type="button" class="btn sec" data-act="mclose">${L("रद्द करें","Cancel")}</button></form>`,{sticky:true});
}
FORMS.pay=f=>{
 const d=fd(f),amt=num(d.amount);
 if(!d.target){toast(L("बुकिंग या बिल चुनें।","Choose a booking or bill."),"err");return false}
 if(amt<=0){toast(L("सही राशि भरें।","Enter a valid amount."),"err");return false}
 const old=d.id?getR("payments",d.id):null,isB=d.target.startsWith("b:"),tid=d.target.slice(2);
 const tgt=isB?getR("bookings",tid):getR("invoices",tid);if(!tgt)return false;
 const bal=isB?balance(tgt):Math.max(0,invCalc(tgt).total-invPaid(tgt));
 const bal2=bal+(old&&((isB&&old.bookingId===tid)||(!isB&&old.invoiceId===tid))?num(old.amount):0);
 if(amt>bal2&&!confirm(L("यह राशि बाकी रकम ("+money(bal2)+") से ज्यादा है। फिर भी सेव करें?","This exceeds the balance ("+money(bal2)+"). Save anyway?")))return false;
 const rec=Object.assign({id:d.id||uid(),createdAt:nowISO()},old||{},{bookingId:isB?tid:"",invoiceId:isB?"":tid,customerId:tgt.customerId||"",amount:amt,date:d.date,method:d.method,type:d.ptype,note:d.note});
 if(!isB)delete rec.bookingId;else delete rec.invoiceId;
 put("payments",rec);toast(L("भुगतान सेव हो गया।","Payment saved."),"ok");
};
ACT.delpay=t=>{
 const id=t.dataset.id;if(!confirm(L("इस भुगतान को रीसायकल बिन में भेजें?","Move this payment to the Recycle bin?")))return;
 softDel("payments",id);closeAllModals();refresh();toast(L("भुगतान बिन में भेजा गया।","Payment moved to bin."),"ok",{label:L("वापस लाएँ","Undo"),fn:()=>{restoreR("payments",id);refresh()}});
};
</script>
<script>
/* =====================================================================
   भाग 3: आय-खर्च, स्टॉक/सामान, बिल-कोटेशन, कर्मचारी, रिमाइंडर
   ===================================================================== */

/* ---------- आय और खर्च ---------- */
function ledgerFiltered(){
 const f=S.lf,[a,z]=perRange(f.per,f.from,f.to);
 return ledgerRows().filter(r=>inR(r.date,a,z)&&(f.tab==="all"||r.type===f.tab)).sort((x,y)=>String(y.date).localeCompare(x.date));
}
const srcLabel=r=>r.src==="payment"?L("बुकिंग भुगतान","Booking payment"):r.src==="emp"?L("कर्मचारी भुगतान","Employee pay"):r.src==="bworker"?L("बुकिंग कारीगर","Booking workers"):"";
function ledgerListHtml(){
 const l=ledgerFiltered();if(!l.length)return empty("📒",L("इस अवधि में कोई प्रविष्टि नहीं।","No entries in this period."));
 return l.map(r=>`<div class="li ${r.type==="expense"?"":"done"}" data-act="ledrow" data-src="${r.src}" data-id="${esc(r.id)}"><div class="top"><strong style="color:${r.type==="expense"?"var(--bad)":"var(--ok)"}">${r.type==="expense"?"−":"+"} ${money(r.amount)}</strong><span class="small muted">${esc(fmtDate(r.date))}</span></div>
 <div class="small"><b>${esc(catL(r.cat))}</b>${r.note?" • "+esc(r.note):""}</div><div class="meta">${r.src!=="ledger"?`<span class="pill gray">${srcLabel(r)}</span>`:""}${r.method?`<span class="pill gray">${esc(pmL(r.method))}</span>`:""}</div></div>`).join("");
}
VIEWS.ledger=()=>{
 const F=S.lf,[a,z]=perRange(F.per,F.from,F.to),c=calc(a,z),l=ledgerFiltered(),by={};
 l.forEach(r=>{const k=r.type+"|"+r.cat;by[k]=(by[k]||0)+r.amount});
 const cats=Object.keys(by).map(k=>({t:k.split("|")[0],c:k.split("|").slice(1).join("|"),v:by[k]})).sort((x,y)=>y.v-x.v);
 return pageHead("📒 "+L("आय और खर्च","Income & Expense"),`<button class="btn" data-act="addinc">➕ ${L("आय","Income")}</button><button class="btn danger" data-act="addexp">➕ ${L("खर्च","Expense")}</button>`)+
 `<div class="grid g3"><div class="kpi ok"><div class="l">📈 ${L("कुल आय","Income")}</div><div class="v">${money(c.income)}</div></div><div class="kpi bad"><div class="l">📉 ${L("कुल खर्च","Expense")}</div><div class="v">${money(c.expense)}</div></div><div class="kpi ${c.profit>=0?"ok":"bad"}"><div class="l">🏆 ${L("शुद्ध लाभ","Net profit")}</div><div class="v">${money(c.profit)}</div></div></div>
 <div class="card" style="margin-top:12px">${perChips(F.per,"lper",true)}${dateRangeInputs(F,"ldate")}${chipsHtml([["all",L("सभी","All")],["income",L("आय","Income")],["expense",L("खर्च","Expense")]],F.tab,"ltab")}
 ${cats.length?`<div class="small b" style="margin-top:6px">${L("कैटेगरी के अनुसार","By category")}</div>${cats.map(x=>`<div class="kv"><span>${x.t==="expense"?"📉":"📈"} ${esc(catL(x.c))}</span><b>${money(x.v)}</b></div>`).join("")}`:""}</div>
 <div class="small muted">${L("ℹ️ बुकिंग के भुगतान, कर्मचारी भुगतान और बुकिंग के कारीगर खर्च अपने-आप यहाँ जुड़ते हैं (उन्हें बुकिंग/कर्मचारी सेक्शन से बदलें)।","ℹ️ Booking payments, employee pay and booking workers are added here automatically (edit them from their own sections).")}</div>
 <div>${ledgerListHtml()}</div>`;
};
ACT.lper=t=>{S.lf.per=t.dataset.id;refresh()};ACT.ltab=t=>{S.lf.tab=t.dataset.id;refresh()};
INP.ldate=t=>{S.lf[t.dataset.k]=t.value;refresh()};
ACT.addinc=()=>{closeAllModals();openLedgerForm("","income")};
ACT.addexp=()=>{closeAllModals();openLedgerForm("","expense")};
ACT.ledrow=t=>{
 const s=t.dataset.src,id=t.dataset.id;
 if(s==="ledger"){const l=getR("ledger",id);if(l&&String(id).startsWith("sm_")){toast(L("यह स्टॉक आवक/जावक से जुड़ी है — स्टॉक सेक्शन से बदलें।","Linked to stock movement — edit it in Stock."));return}openLedgerForm(id,"")}
 else if(s==="payment")openPayForm(id);
 else if(s==="bworker")showBooking(id);
 else if(s==="emp")go("employees");
};
const catOpts=t=>(t==="income"?INC:EXP).map(x=>[x[0],L(x[0],x[1])]);
function openLedgerForm(id,type){
 const l=id?getR("ledger",id):null,tp=l?l.type:type;
 openModal(l?L("✏️ प्रविष्टि एडिट","✏️ Edit entry"):(tp==="income"?L("➕ आय जोड़ें","➕ Add income"):L("➕ खर्च जोड़ें","➕ Add expense")),`<form data-form="ledger"><input type="hidden" name="id" value="${esc(id)}">
 ${fld(L("प्रकार","Type"),sel("type",[["income",L("आय","Income")],["expense",L("खर्च","Expense")]],tp,'data-ch="ltype"'))}
 ${fld(L("कैटेगरी","Category"),`<span id="lcatBox">${sel("cat",catOpts(tp),l?l.cat:"")}</span>`)}
 <div class="r2">${fld(L("राशि ₹ *","Amount ₹ *"),inp("amount",l?l.amount:"",'type="number" inputmode="decimal" min="0" step="any" required'))}${fld(L("तारीख *","Date *"),inp("date",l?l.date:todayStr(),'type="date" required'))}</div>
 ${fld(L("माध्यम","Method"),sel("method",PM.map(m=>[m[0],pmL(m[0])]),l?l.method:"कैश"))}${fld(L("नोट","Note"),inp("note",l?l.note:""))}
 <button class="btn" type="submit">${L("सेव करें","Save")}</button>${l?`<button type="button" class="btn danger" data-act="delledger" data-id="${esc(id)}">🗑️</button>`:""}<button type="button" class="btn sec" data-act="mclose">${L("रद्द करें","Cancel")}</button></form>`,{sticky:true});
}
CHG.ltype=t=>{el("lcatBox").innerHTML=sel("cat",catOpts(t.value),"")};
FORMS.ledger=f=>{
 const d=fd(f);if(num(d.amount)<=0){toast(L("सही राशि भरें।","Enter a valid amount."),"err");return false}
 const old=d.id?getR("ledger",d.id):null;
 put("ledger",Object.assign({id:d.id||uid(),createdAt:nowISO()},old||{},{type:d.type,cat:d.cat,amount:num(d.amount),date:d.date,method:d.method,note:d.note}));
 toast(L("सेव हो गया।","Saved."),"ok");
};
ACT.delledger=t=>{const id=t.dataset.id;if(!confirm(L("रीसायकल बिन में भेजें?","Move to Recycle bin?")))return;softDel("ledger",id);closeAllModals();refresh();toast(L("बिन में भेजा गया।","Moved to bin."),"ok",{label:L("वापस लाएँ","Undo"),fn:()=>{restoreR("ledger",id);refresh()}})};

/* ---------- स्टॉक / सामान ---------- */
function stockItems(){
 const q=S.sf.q.trim().toLowerCase();
 return rows("inventory").filter(i=>!q||(i.name+" "+(i.category||"")+" "+(i.supplier||"")).toLowerCase().includes(q)).sort((a,b)=>(a.ord||0)-(b.ord||0));
}
function stockListHtml(){
 const l=stockItems();if(!l.length)return empty("📦",L("कोई सामान नहीं है।","No items."));
 return l.map(i=>{const s=stockNow(i),low=isLow(i);
  return `<div class="li ${low?"low":""}"><div class="top"><strong>${esc(i.name)}</strong><span class="pill ${low?"wait":"ok"}">${s} ${esc(i.unit||"")}</span></div>
  <div class="small muted">${i.category?esc(i.category)+" • ":""}${L("खरीद","Buy")} ${money(i.buy)} • ${L("बिक्री","Sell")} ${money(i.sell)}${num(i.minStock)>0?" • "+L("न्यूनतम","Min")+" "+num(i.minStock):""}${i.supplier?" • "+esc(i.supplier):""}</div>
  ${low?`<div class="warnbox">⚠️ ${L("स्टॉक कम है!","Low stock!")}</div>`:""}
  <div class="acts"><button class="btn sm" data-act="stockmove" data-id="${esc(i.id)}" data-t="in">➕ ${L("आवक","In")}</button><button class="btn sm orange" data-act="stockmove" data-id="${esc(i.id)}" data-t="out">➖ ${L("जावक","Out")}</button><button class="btn sm sec" data-act="edititem" data-id="${esc(i.id)}">✏️</button><button class="btn sm ghost" data-act="itemhist" data-id="${esc(i.id)}">📜</button><button class="btn sm danger" data-act="delitem" data-id="${esc(i.id)}">🗑️</button></div></div>`}).join("");
}

FORMS.item=f=>{

 const old=d.id?getR("inventory",d.id):null;
 const rec=Object.assign({id:d.id||uid(),ord:(rows("inventory").reduce((m,x)=>Math.max(m,x.ord||0),0)+1),selected:!!d.qty},old||{},{name:d.name,category:d.category,unit:d.unit,buy:num(d.buy),sell:num(d.sell),minStock:num(d.minStock),supplier:d.supplier,buyDate:d.buyDate,qty:d.qty});

function parseBulk(txt){
 const seen=new Set(DB.inventory.filter(i=>i.bid===ACTIVE&&!i.del).map(i=>String(i.name||"").trim().toLowerCase())),out=[];let dup=0;
 String(txt||"").split(/[,\n，、;]+/).forEach(raw=>{
  const part=raw.trim();if(!part)return;
  let name=part,qty="";const ix=part.indexOf(":");
  if(ix>0){name=part.slice(0,ix).trim();qty=part.slice(ix+1).trim()}
  if(!name)return;const k=name.toLowerCase();
  if(seen.has(k)){dup++;return}seen.add(k);out.push({name,qty});
 });
 return {out,dup};
}
INP.pkbulk=t=>{const r=parseBulk(t.value);el("pkBulkCnt").textContent=t.value.trim()?r.out.length+" "+L("नए सामान मिले","new items found")+(r.dup?" • "+r.dup+" "+L("पहले से सूची में हैं","already in list"):""):""};
ACT.packclear=()=>{el("pkBulk").value="";el("pkBulkCnt").textContent=""};

 if(r.out.length>500){toast(L("एक बार में अधिकतम 500 सामान जोड़ें।","Add at most 500 items at a time."),"err");return}
 let ord=rows("inventory").reduce((m,i)=>Math.max(m,i.ord||0),0);
 r.out.forEach((x,i)=>put("inventory",{id:uid()+"_"+i,name:x.name,qty:x.qty,selected:!!x.qty,ord:++ord,category:"",unit:"",buy:0,sell:0,openStock:0,minStock:0,supplier:"",buyDate:""}));
 ACT.packclear();renderPack();
 toast(r.out.length+" "+L("नए सामान जोड़े गए।","new items added.")+(r.dup?" "+r.dup+" "+L("सामान पहले से सूची में थे, छोड़ दिए गए।","items were already in the list and were skipped."):""),"ok");
};

function empMonth(e,m){
 const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();let P=0,H=0,A=0;
 rows("attendance").filter(a=>a.empId===e.id&&String(a.date).startsWith(m)).forEach(a=>{if(a.status==="P")P++;else if(a.status==="H")H++;else if(a.status==="A")A++});
 const eff=P+H/2,earned=Math.round(e.salaryType==="daily"?num(e.salary)*eff:num(e.salary)*eff/dim);
 const pd=rows("empPayments").filter(p=>p.empId===e.id&&String(p.date).startsWith(m)).reduce((s,p)=>s+num(p.amount),0);
 return {P,H,A,eff,earned,paid:pd,due:earned-pd,dim};
}
const attOf=(e,d)=>{const a=getR("attendance","att_"+e+"_"+d);return a&&!a.del?a.status:""};

}

 <div class="small muted">${L("ℹ️ मासिक वेतन = वेतन × (उपस्थित + आधे दिन/2) ÷ महीने के दिन। जिन दिनों की हाजिरी नहीं भरी वे गिने नहीं जाते।","ℹ️ Monthly pay = salary × (present + half days/2) ÷ days in month. Unmarked days are not counted.")}</div>`;

function reminderList(){
 return memo("rem"+todayStr()+(PREF.remDays||2),()=>{
 const t=todayStr(),lim=addDays(t,PREF.remDays||2),out=[];
 rows("bookings").forEach(b=>{
  if(b.status==="रद्द")return;
  if(b.status!=="काम पूरा"){
   if(b.date>=t&&b.date<=lim)out.push({key:"bk"+b.id,ic:"📅",title:L("आने वाली बुकिंग: ","Upcoming booking: ")+b.name,sub:dateRangeText(b),date:b.date,urgent:true,act:"details",id:b.id});
   if((b.endDate||b.date)<=t&&b.date<=t&&b.status!=="बातचीत जारी")out.push({key:"end"+b.id,ic:"🏁",title:L("काम पूरा करने की तारीख: ","Work end date: ")+b.name,sub:L("काम पूरा हो गया हो तो स्टेटस 'काम पूरा' करें — ","If finished, mark it Completed — ")+dateRangeText(b),date:b.endDate||b.date,urgent:true,act:"details",id:b.id});
  }
  const bal=balance(b);
  if(bal>0&&b.payDue&&b.payDue<=lim)out.push({key:"pd"+b.id,ic:"💳",title:L("भुगतान की अंतिम तारीख: ","Payment due: ")+b.name,sub:L("बाकी ","Balance ")+money(bal)+" • "+fmtDate(b.payDue),date:b.payDue,urgent:true,act:"addpay",id:b.id});
 });
 rows("inventory").filter(isLow).forEach(i=>out.push({key:"low"+i.id,ic:"⚠️",title:L("स्टॉक कम: ","Low stock: ")+i.name,sub:L("वर्तमान ","Now ")+stockNow(i)+" / "+L("न्यूनतम ","Min ")+num(i.minStock),date:t,urgent:true,act:"go",id:"stock"}));
 rows("reminders").forEach(r=>{
  if(r.done)return;
  out.push({key:"m"+r.id,ic:r.type==="call"?"📞":r.type==="payment"?"💳":"🔔",title:r.title,sub:(r.customerName?r.customerName+" • ":"")+fmtDate(r.date)+(r.time?" "+fmtTime(r.time):""),date:r.date,time:r.time||"",urgent:r.date<=lim,act:"remedit",id:r.id,manual:true,phone:r.phone||""});
 });
 return out.sort((a,b)=>String(a.date).localeCompare(b.date));
 });
}
const remRow=r=>`<div class="kv" style="align-items:center"><span data-act="${r.act}" data-id="${esc(r.id)}" style="cursor:pointer;min-width:0">${r.ic} <b>${esc(r.title)}</b><br><small>${esc(r.sub)}</small></span><span>${r.manual?`<button class="btn sm ok" style="margin:0;background:var(--ok)" data-act="remdone" data-id="${esc(r.id)}">✔</button>`:""}</span></div>`;
VIEWS.reminders=()=>{
 const l=reminderList(),urgent=l.filter(r=>r.urgent),later=l.filter(r=>!r.urgent),done=rows("reminders").filter(r=>r.done);
 const perm="Notification" in window?Notification.permission:"unsupported";
 return pageHead("🔔 "+L("रिमाइंडर","Reminders"),`<button class="btn" data-act="newrem">➕ ${L("रिमाइंडर जोड़ें","Add reminder")}</button>`)+
 `<div class="card"><h3>${L("आज / जरूरी","Today / urgent")} (${urgent.length})</h3>${urgent.length?urgent.map(remRow).join(""):`<div class="small muted">${L("कुछ भी जरूरी नहीं है 🎉","Nothing urgent 🎉")}</div>`}</div>
 ${later.length?`<div class="card"><h3>${L("आगे के रिमाइंडर","Later")}</h3>${later.map(remRow).join("")}</div>`:""}
 ${done.length?`<div class="card"><h3>✔ ${L("पूरे हुए","Done")} (${done.length})</h3>${done.slice(0,10).map(r=>`<div class="kv"><span style="text-decoration:line-through">${esc(r.title)}<br><small>${esc(fmtDate(r.date))}</small></span><button class="btn sm ghost" style="margin:0" data-act="remundo" data-id="${esc(r.id)}">↩</button></div>`).join("")}</div>`:""}
 <div class="card"><h3>🔔 ${L("नोटिफिकेशन","Notifications")}</h3><div class="small muted">${L("ऐप खुला/बैकग्राउंड में होने पर फोन नोटिफिकेशन दिखेंगे। स्थिति: ","Phone notifications show while the app is open/in background. Status: ")}<b>${perm==="granted"&&PREF.notif?L("चालू","On"):L("बंद","Off")}</b></div><button class="btn" data-act="notifon">${PREF.notif?L("बंद करें","Turn off"):L("चालू करें","Turn on")}</button></div>`;
};
ACT.notifon=async()=>{
 if(PREF.notif){PREF.notif=false;savePref();refresh();return}
 if(!("Notification" in window)){toast(L("यह ब्राउज़र नोटिफिकेशन सपोर्ट नहीं करता।","This browser doesn't support notifications."),"err");return}
 let p=Notification.permission;if(p!=="granted")p=await Notification.requestPermission();
 if(p==="granted"){PREF.notif=true;savePref();toast(L("नोटिफिकेशन चालू हो गए।","Notifications enabled."),"ok");checkNotify(true)}else toast(L("अनुमति नहीं मिली। ब्राउज़र सेटिंग में अनुमति दें।","Permission denied. Allow it in browser settings."),"err");
 refresh();
};

ACT.remedit=t=>{closeAllModals();openRemForm(t.dataset.id)};
function openRemForm(id){
 const r=id?getR("reminders",id):{type:"call",title:"",date:todayStr(),time:"",customerId:"",note:""};
 openModal(id?L("✏️ रिमाइंडर","✏️ Reminder"):L("➕ नया रिमाइंडर","➕ New reminder"),`<form data-form="rem"><input type="hidden" name="id" value="${esc(id)}">
 ${fld(L("प्रकार","Type"),sel("type",[["call",L("ग्राहक को फोन करना","Call customer")],["payment",L("भुगतान की अंतिम तारीख","Payment due date")],["custom",L("अन्य","Other")]],r.type))}
 ${fld(L("ग्राहक (वैकल्पिक)","Customer (optional)"),sel("customerId",[["",L("— कोई नहीं —","— none —")]].concat(rows("customers").sort((a,b)=>String(a.name).localeCompare(b.name)).map(c=>[c.id,c.name+(c.phone?" ("+c.phone+")":"")])),r.customerId))}
 ${fld(L("क्या याद दिलाना है *","What to remember *"),inp("title",r.title,"required"))}<div class="r2">${fld(L("तारीख *","Date *"),inp("date",r.date,'type="date" required'))}${fld(L("समय","Time"),inp("time",r.time||"",'type="time"'))}</div>
 <button class="btn" type="submit">${L("सेव करें","Save")}</button>${id?`<button type="button" class="btn danger" data-act="delrem" data-id="${esc(id)}">🗑️</button>`:""}<button type="button" class="btn sec" data-act="mclose">${L("रद्द करें","Cancel")}</button></form>`,{sticky:true});
}
FORMS.rem=f=>{
 const d=fd(f);if(!d.title)return false;const old=d.id?getR("reminders",d.id):null,c=d.customerId?getR("customers",d.customerId):null;
 put("reminders",Object.assign({id:d.id||uid(),createdAt:nowISO(),done:false},old||{},{type:d.type,title:d.title,date:d.date,time:d.time,customerId:d.customerId,customerName:c?c.name:"",phone:c?c.phone:""}));
 toast(L("रिमाइंडर सेव हो गया।","Reminder saved."),"ok");
};
ACT.remdone=t=>{const r=getR("reminders",t.dataset.id);if(r){r.done=true;put("reminders",r);refresh()}};
ACT.remundo=t=>{const r=getR("reminders",t.dataset.id);if(r){r.done=false;put("reminders",r);refresh()}};
ACT.delrem=t=>{softDel("reminders",t.dataset.id);closeAllModals();refresh()};
async function checkNotify(force){
 if(!PREF.notif||!("Notification" in window)||Notification.permission!=="granted")return;
 const seen=sp(localStorage.getItem(NOTI_KEY),{}),t=todayStr(),now=new Date(),hm=pad(now.getHours())+":"+pad(now.getMinutes());
 Object.keys(seen).forEach(k=>{if(!k.endsWith(t))delete seen[k]});
 const due=reminderList().filter(r=>r.urgent&&!seen[r.key+"@"+t]&&(!r.manual||r.date<t||(r.date===t&&(!r.time||r.time<=hm))));
 if(!due.length)return;
 for(const r of due.slice(0,3)){
  seen[r.key+"@"+t]=1;
  try{const reg=await navigator.serviceWorker.getRegistration();const o={body:r.sub,icon:"./icon-192.png",tag:r.key};if(reg&&reg.showNotification)reg.showNotification(r.title,o);else new Notification(r.title,o)}catch(e){}
 }
 due.slice(3).forEach(r=>{seen[r.key+"@"+t]=1});
 localStorage.setItem(NOTI_KEY,JSON.stringify(seen));
}

async function makePdf(html,name,landscape){
 if(!window.html2pdf)throw new Error("PDF library missing");
 const W=landscape?960:640;
 // बाहरी आवरण: स्क्रीन के बाहर छिपा रहता है, पर अंदर का box सामान्य जगह (0,0) पर रहता है
 // (पहले box ही left:-12000px पर था, इसलिए html2pdf उसकी कॉपी भी स्क्रीन के बाहर रेंडर करता था → PDF खाली/सफ़ेद आती थी)
 const wrap=document.createElement("div");
 wrap.style.cssText="position:fixed;left:-20000px;top:0;width:"+W+"px;pointer-events:none";
 const box=document.createElement("div");
 box.style.cssText="width:"+W+"px;background:#fff;color:#222;padding:24px;box-sizing:border-box;font-family:'Noto Sans Devanagari','Mangal',Arial,sans-serif";
 box.innerHTML=html;
 wrap.appendChild(box);document.body.appendChild(wrap);
 try{
  // फ़ॉन्ट और सभी तस्वीरें (लोगो आदि) पूरी लोड होने तक रुकें
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
  await Promise.all(Array.from(box.querySelectorAll("img")).map(im=>im.complete&&im.naturalWidth?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,4000)})));
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  // मोबाइल में बहुत बड़ा canvas खाली/काला बन जाता है, इसलिए लंबे पेज पर scale अपने-आप घटाएँ
  const H=Math.max(box.scrollHeight,100);
  const scale=Math.max(1,Math.min(2,Math.sqrt(12000000/(W*H))));
  const blob=await html2pdf().from(box).set({
   margin:10,filename:name,
   image:{type:"jpeg",quality:.95},
   html2canvas:{scale:scale,useCORS:true,allowTaint:false,backgroundColor:"#ffffff",scrollX:0,scrollY:0,windowWidth:W+40,logging:false},
   jsPDF:{unit:"mm",format:"a4",orientation:landscape?"landscape":"portrait"},
   pagebreak:{mode:["css","legacy"],avoid:"tr"}
  }).outputPdf("blob");
  if(!blob||blob.size<1500)throw new Error("empty pdf");
  return new File([blob],name,{type:"application/pdf"});
 }finally{wrap.remove()}
}

function groupRange(a,z){
 if(!a||!z){const ds=ledgerRows().map(r=>r.date).concat(rows("bookings").map(b=>b.date)).filter(Boolean).sort();if(!ds.length)return[];a=a||ds[0];z=z||ds[ds.length-1]}
 const n=daysBetween(a,z);if(n<=0)return[];const out=[];
 if(n<=62){for(let i=0;i<n;i++){const d=addDays(a,i);out.push([fmtDate(d),d,d])}}
 else{let cur=a.slice(0,7),guard=0;while(cur+"-01"<=z&&guard++<120){const s=cur+"-01"<a?a:cur+"-01",e=monthEnd(cur+"-01")>z?z:monthEnd(cur+"-01");out.push([cur.slice(5,7)+"-"+cur.slice(0,4),s,e]);const y=+cur.slice(0,4),m=+cur.slice(5,7);cur=m===12?(y+1)+"-01":y+"-"+pad(m+1)}}
 return out;
}
function buildReport(type,a,z){

 const R={type,per,sections:[]};
 if(type==="summary"){

  const gr=groupRange(a,z).map(g=>{const x=calc(g[1],g[2]);return [g[0],x.sales,x.income,x.expense,x.profit]}).filter(r=>r.slice(1).some(v=>v!==0));

  const by=(tp)=>{const m={};c.lr.filter(r=>r.type===tp).forEach(r=>{m[r.cat]=(m[r.cat]||0)+r.amount});return Object.keys(m).map(k=>[catL(k),money(m[k]),m[k]]).sort((x,y)=>y[2]-x[2]).map(r=>[r[0],r[1]])};
  const ic=by("income"),ex=by("expense"),pm={};c.lr.filter(r=>r.type==="income").forEach(r=>{const k=r.method||"-";pm[k]=(pm[k]||0)+r.amount});
  if(ic.length)R.sections.push({title:L("आय (कैटेगरी अनुसार)","Income by category"),head:[L("कैटेगरी","Category"),L("राशि","Amount")],rows:ic});

 }else if(type==="bookings"){
  R.title=L("बुकिंग रिपोर्ट","Booking report");
  const l=rows("bookings").filter(b=>inR(b.date,a,z)).sort((x,y)=>String(x.date).localeCompare(y.date));

 }else if(type==="customers"){

 }else if(type==="stock"){

const TRASH_COLS=["bookings","customers","payments","ledger","inventory","stockMoves","invoices","employees","empPayments","reminders"];
const TRASH_L={bookings:["📋","बुकिंग","Booking"],customers:["👥","ग्राहक","Customer"],payments:["💳","भुगतान","Payment"],ledger:["📒","आय/खर्च","Income/Expense"],inventory:["📦","सामान","Item"],stockMoves:["🔁","स्टॉक रिकॉर्ड","Stock record"],invoices:["🧾","बिल","Bill"],employees:["👷","कर्मचारी","Employee"],empPayments:["💵","कर्मचारी भुगतान","Employee payment"],reminders:["🔔","रिमाइंडर","Reminder"],businesses:["🏢","व्यवसाय","Business"]};
function trashTitle(c,r){
 switch(c){
  case"bookings":case"customers":case"inventory":case"employees":case"businesses":return r.name||"-";
  case"payments":case"empPayments":return money(r.amount)+" • "+fmtDate(r.date);
  case"ledger":return catL(r.cat)+" • "+money(r.amount);
  case"stockMoves":{const i=getR("inventory",r.itemId);return (i?i.name:"")+" × "+num(r.qty)}
  case"invoices":return r.no+" • "+(r.name||"");
  case"reminders":return r.title;
 }return r.id;
}
function trashItems(){
 const l=[];
 TRASH_COLS.forEach(c=>DB[c].forEach(r=>{if(r.del&&r.bid===ACTIVE)l.push({c,r})}));
 DB.businesses.forEach(r=>{if(r.del)l.push({c:"businesses",r})});
 return l.sort((a,b)=>String(b.r.delAt||"").localeCompare(a.r.delAt||""));
}

};

 try{const r=await navigator.serviceWorker.getRegistration();if(!r){toast(L("ऐप अभी ऑफलाइन-मोड में नहीं है। पेज दोबारा खोलें।","Offline mode not active yet. Reopen the page."));return}await r.update();

 try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}
 location.reload();
};

/* ---------- बैकअप और Restore ---------- */
function backupObj(){return {app:"WORK MANAGER",version:4,exportedAt:nowISO(),activeBiz:ACTIVE,db:DB,prefs:PREF,userProfile:sp(localStorage.getItem(USER_KEY),{}),workerCats,workerRates}}
function backupDownload(prefix){
 flushLocal();downloadBlob(new Blob([JSON.stringify(backupObj(),null,2)],{type:"application/json"}),(prefix||"WORK-Manager-Full-Backup-")+fileStamp()+".json");
 localStorage.setItem(LASTBK_KEY,nowISO());
}
ACT.backup=()=>{backupDownload();toast(L("बैकअप डाउनलोड हो गया।","Backup downloaded."),"ok");refresh()};
ACT.restorepick=()=>el("restoreFile").click();
// बैकअप फाइल की जांच: पुराना (array / bookings+businessItems) और नया (db) दोनों स्वीकार
function parseBackup(txt){
 let d;try{d=JSON.parse(txt)}catch(e){throw new Error(L("यह सही JSON फाइल नहीं है।","This is not a valid JSON file."))}
 if(Array.isArray(d)){if(d.some(x=>!x||typeof x!=="object"))throw new Error("bad");return {kind:"old",db:legacyToDB(d,ACTIVE),skipped:0}}
 if(!d||typeof d!=="object")throw new Error("bad");
 if(d.db&&typeof d.db==="object"){
  const db=emptyDB();let skipped=0;
  COLS.forEach(c=>{
   const a=d.db[c];if(a===undefined)return;
   if(!Array.isArray(a))throw new Error(L("बैकअप में '"+c+"' का ढांचा गलत है।","Backup has a wrong structure for '"+c+"'."));
   a.forEach(r=>{if(r&&typeof r==="object"&&r.id!=null&&String(r.id)!=="")db[c].push(Object.assign({},r,{id:String(r.id)}));else skipped++});
  });
  if(!COLS.some(c=>db[c].length))throw new Error(L("बैकअप खाली है।","The backup is empty."));
  return {kind:"new",db,skipped,raw:d};
 }
 if(Array.isArray(d.bookings)){
  const db=legacyToDB(d,ACTIVE);
  return {kind:"old",db,skipped:0,profile:d.profile,logo:d.logo};
 }
 throw new Error(L("यह WORK MANAGER की सही बैकअप फाइल नहीं है।","This is not a valid WORK MANAGER backup file."));
}
let PENDING_RESTORE=null;
el("restoreFile").addEventListener("change",e=>{
 const file=e.target.files[0];e.target.value="";if(!file)return;
 const rd=new FileReader();rd.onload=()=>{
  let p;try{p=parseBackup(rd.result)}catch(err){toast(err.message==="bad"?L("यह सही WORK MANAGER बैकअप फाइल नहीं है।","This is not a valid WORK MANAGER backup file."):err.message,"err");return}
  PENDING_RESTORE=p;
  const cnt=COLS.filter(c=>p.db[c].length).map(c=>`<div class="kv"><span>${esc(c)}</span><b>${p.db[c].length}</b></div>`).join("");
  openModal(L("📤 बैकअप Restore","📤 Restore backup"),`<div class="warnbox">${p.kind==="old"?L("यह पुराने ऐप की बैकअप फाइल है। इसका डेटा चालू व्यवसाय ("+esc(biz().name)+") में जुड़ेगा।","This is a backup from the old app. Its data goes into the active business ("+esc(biz().name)+")."):L("फाइल सही है ✅ — नीचे देखें क्या-क्या मिला।","File is valid ✅ — see what it contains below.")}${p.skipped?" • "+p.skipped+" "+L("खराब रिकॉर्ड छोड़े जाएँगे","bad records will be skipped"):""}</div><div class="card" style="margin-top:8px">${cnt}</div>
  <div class="small muted">${L("शुरू करने से पहले अभी के डेटा की सुरक्षा-कॉपी अपने-आप बन जाती है, और Restore के बाद 'वापस लें' का विकल्प रहता है।","A safety copy of your current data is made automatically, and you can undo after restoring.")}</div>
  <button class="btn block" data-act="dorestore" data-mode="new">➕ ${L("सिर्फ़ नया डेटा जोड़ें (सुझाया गया — पुराना कुछ नहीं बदलेगा)","Add only new data (recommended — nothing existing is changed)")}</button>
  <button class="btn orange block" data-act="dorestore" data-mode="over">♻️ ${L("नया जोड़ें + मिलते-जुलते रिकॉर्ड बैकअप वाले से बदलें","Add new + overwrite matching records with backup")}</button>
  <button class="btn danger block" data-act="dorestore" data-mode="replace">⚠️ ${L("पूरा डेटा बैकअप जैसा कर दें (बाकी रीसायकल बिन में जाएगा)","Make everything exactly like the backup (others go to Recycle bin)")}</button>
  <button class="btn sec block" data-act="mclose">${L("रद्द करें","Cancel")}</button>`,{sticky:true});
 };rd.readAsText(file);
});
function saveUndo(){
 try{localStorage.setItem(UNDO_KEY,JSON.stringify({at:nowISO(),db:DB,active:ACTIVE}))}
 catch(e){try{backupDownload("WORK-Manager-Before-Restore-")}catch(x){}toast(L("मेमोरी कम है — सुरक्षा-बैकअप फाइल डाउनलोड हुई।","Low memory — a safety backup file was downloaded."))}
}
function applyRestore(p,mode){
 const now=nowISO(),inc=p.db;let added=0,over=0,skip=0;
 COLS.forEach(c=>{
  const ids=new Set();
  inc[c].forEach(r0=>{
   const r=Object.assign({},r0);normRec(c,r);ids.add(r.id);
   const ex=getR(c,r.id);
   if(!ex){r.updatedAt=now;DB[c].push(r);enq(c,r.id,"set");added++}
   else if(mode==="over"||mode==="replace"){r.updatedAt=now;DB[c][DB[c].indexOf(ex)]=r;enq(c,r.id,"set");over++}
   else skip++;
  });
  if(mode==="replace"&&(p.kind==="new"||c!=="businesses")){
   DB[c].forEach(r=>{
    if(ids.has(r.id)||r.del)return;
    if(p.kind==="old"&&(c==="businesses"||r.bid!==ACTIVE))return;
    r.del=1;r.delAt=now;r.updatedAt=now;enq(c,r.id,"set");
   });
  }
 });
 if(p.kind==="old"&&p.profile&&typeof p.profile==="object"){
  const b=biz(),pr=p.profile;
  if(b&&(b.auto||mode!=="new")){Object.assign(b,{name:pr.bizName||b.name,owner:pr.ownerName||b.owner,phone:pr.bizPhone||b.phone,address:pr.bizAddress||b.address,tagline:pr.tagline||b.tagline,logo:pr.logo||p.logo||b.logo});put("businesses",b)}
 }
 ensureAdvPayments();ensureBusiness();persist(true);
 return {added,over,skip};
}
ACT.dorestore=t=>{
 const p=PENDING_RESTORE;if(!p)return;const mode=t.dataset.mode;
 if(mode==="replace"&&!confirm(L("पक्का? अभी का बाकी डेटा रीसायकल बिन में चला जाएगा।","Sure? Your remaining current data will move to the Recycle bin.")))return;
 if(mode==="over"&&!confirm(L("मिलते-जुलते रिकॉर्ड बैकअप वाले से बदल जाएँगे। जारी रखें?","Matching records will be overwritten by the backup. Continue?")))return;
 saveUndo();
 const r=applyRestore(p,mode);PENDING_RESTORE=null;closeAllModals();
 const m=getR("businesses",ACTIVE);if(!m||m.del)ensureBusiness();
 refresh();toast(L("Restore हो गया: "+r.added+" नए, "+r.over+" बदले, "+r.skip+" छोड़े।","Restored: "+r.added+" new, "+r.over+" replaced, "+r.skip+" skipped."),"ok");
};
ACT.restoreundo=()=>{
 const u=sp(localStorage.getItem(UNDO_KEY),null);if(!u||!u.db){toast(L("वापस लेने के लिए कुछ नहीं है।","Nothing to undo."),"err");return}
 if(!confirm(L("आखिरी Restore से पहले की स्थिति वापस लाएँ?","Go back to the state before the last restore?")))return;
 const snap=emptyDB();COLS.forEach(c=>{snap[c]=Array.isArray(u.db[c])?u.db[c]:[]});
 applyRestore({kind:"new",db:snap,skipped:0},"replace");
 localStorage.removeItem(UNDO_KEY);refresh();toast(L("पहले की स्थिति वापस आ गई।","Previous state restored."),"ok");
};

/* ---------- शुरुआत ---------- */
function showUpdate(w){toast(L("🔄 नया वर्शन उपलब्ध है","🔄 New version available"),"",{label:L("अपडेट करें","Update"),fn:()=>w.postMessage("SKIP_WAITING"),sticky:true})}
function registerSW(){
 if(!("serviceWorker" in navigator)||location.protocol==="file:")return;
 const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register("./sw.js").then(reg=>{
  REG=reg;if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
  reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(nw)nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdate(nw)})});
 }).catch(()=>{});
 let reloading=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||reloading)return;reloading=true;flushLocal();location.reload()});
 setInterval(()=>{if(REG)REG.update().catch(()=>{})},30*60*1000);
}
function boot(){
 loadAll();
 document.documentElement.lang=LANG;
 if(!location.hash)history.replaceState(null,"","#/home");
 S.view=curView();renderAll();updateOffBar();
 initFirebase();registerSW();
 setTimeout(()=>{const s=el("splash");s.classList.add("out");setTimeout(()=>s.remove(),600)},650);
 setInterval(()=>{DBV++;paintTop();checkNotify()},60000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){DBV++;checkNotify();if(!document.querySelector("#modals .modal"))refresh(true)}});
 setTimeout(()=>checkNotify(),3000);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
