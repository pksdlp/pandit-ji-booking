<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Manager — Smart Booking & Management</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons for Clean, Modern SVG Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- ऊपर की हल्की पट्टी (Streamlined Header) -->
    <header class="app-header">
        <div class="brand-row">
            <i data-lucide="briefcase" class="brand-logo"></i>
            <h1 class="brand-title">WORK MANAGER</h1>
        </div>
        <div class="header-actions">
            <button class="icon-btn" aria-label="खोजें" onclick="toggleSearch()">
                <i data-lucide="search"></i>
            </button>
            <button class="icon-btn" aria-label="सूचनाएँ" onclick="toggleNotifications()">
                <i data-lucide="bell"></i>
            </button>
            <button class="icon-btn" aria-label="और विकल्प" onclick="toggleMoreMenu()">
                <i data-lucide="more-vertical"></i>
            </button>
        </div>
    </header>

    <!-- मुख्य सामग्री क्षेत्र (Main Content Area) -->
    <main class="main-container">

        <!-- होम स्क्रीन: कॉम्पैक्ट प्रोफाइल और मुख्य बटन -->
        <section id="home-screen" class="screen active">
            <div class="compact-profile-card">
                <div class="profile-info">
                    <span class="welcome-text">स्वागत है,</span>
                    <h2>पवन जी</h2>
                </div>
                <span class="status-badge gold-badge">सिंक्ड</span>
            </div>

            <!-- आज की बुकिंग और बाकी भुगतान सारांश -->
            <div class="summary-grid">
                <div class="summary-card">
                    <span class="summary-label">आज की बुकिंग</span>
                    <h3 id="today-bookings-count">0</h3>
                </div>
                <div class="summary-card">
                    <span class="summary-label">कुल बाकी भुगतान</span>
                    <h3 id="total-due-amount" class="text-danger">₹0</h3>
                </div>
            </div>

            <!-- बड़े और आसान एक्शन बटन (अँगूठे की पहुँच में) -->
            <div class="action-buttons-grid">
                <button class="btn btn-primary" onclick="openNewBookingModal()">
                    <i data-lucide="plus-circle"></i> नई बुकिंग
                </button>
                <button class="btn btn-secondary" onclick="openAddPaymentModal()">
                    <i data-lucide="indian-rupee"></i> भुगतान जोड़ें
                </button>
            </div>

            <!-- सादी सूचियाँ (Simplified List View) -->
            <div class="section-header">
                <h3>हाल की बुकिंग्स</h3>
                <button class="text-btn" onclick="viewAllBookings()">सभी देखें</button>
            </div>

            <div class="clean-list" id="recent-bookings-list">
                <!-- उदाहरण पंक्ति (डेटा जावास्क्रिप्ट से लोड होगा) -->
                <div class="list-row">
                    <div class="row-main">
                        <span class="row-title">राहुल शर्मा</span>
                        <span class="row-subtitle">12 नवम् 2026</span>
                    </div>
                    <div class="row-meta">
                        <span class="row-amount">₹5,000</span>
                        <span class="status-chip badge-success">पक्की</span>
                    </div>
                    <button class="icon-btn-small" onclick="openRowMenu(1)">
                        <i data-lucide="more-vertical"></i>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- नीचे नेविगेशन बार (Bottom Navigation for Thumb-Friendly Access) -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <i data-lucide="home"></i>
            <span>होम</span>
        </button>
        <button class="nav-item" onclick="switchTab('bookings')">
            <i data-lucide="calendar"></i>
            <span>बुकिंग</span>
        </button>
        <button class="nav-item" onclick="switchTab('stock')">
            <i data-lucide="package"></i>
            <span>स्टॉक</span>
        </button>
        <button class="nav-item" onclick="switchTab('finance')">
            <i data-lucide="file-text"></i>
            <span>हिसाब</span>
        </button>
        <button class="nav-item" onclick="switchTab('settings')">
            <i data-lucide="settings"></i>
            <span>सेटिंग्स</span>
        </button>
    </nav>

    <!-- नई बुकिंग मॉडल (स्मार्ट और छोटे फ़ॉर्म) -->
    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>नई बुकिंग जोड़ें</h3>
                <button class="icon-btn" onclick="closeModal('booking-modal')"><i data-lucide="x"></i></button>
            </div>
            <form id="booking-form">
                <!-- ज़रूरी खाने (First Fields) -->
                <div class="form-group">
                    <label>ग्राहक का नाम *</label>
                    <input type="text" required placeholder="पूरा नाम दर्ज करें">
                </div>
                <div class="form-group">
                    <label>मोबाइल नंबर *</label>
                    <input type="tel" required placeholder="10 अंकों का मोबाइल नंबर">
                </div>
                <div class="form-group">
                    <label>तारीख *</label>
                    <input type="date" required>
                </div>
                <div class="form-group">
                    <label>रकम (₹) *</label>
                    <input type="number" required placeholder="कुल रकम">
                </div>

                <!-- बाकी विकल्प (Progressive Disclosure) -->
                <div class="collapsible-section">
                    <button type="button" class="text-btn-toggle" onclick="toggleMoreOptions(this)">
                        + और विकल्प जोड़ें (पता, नोट, एडवांस)
                    </button>
                    <div class="hidden-options" id="extra-options" style="display: none;">
                        <div class="form-group">
                            <label>एडवांस भुगतान</label>
                            <input type="number" placeholder="प्राप्त एडवांस रकम">
                        </div>
                        <div class="form-group">
                            <label>पूरा पता / विवरण</label>
                            <textarea placeholder="स्थान या अन्य नोट"></textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary full-width">बुकिंग सेव करें</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
